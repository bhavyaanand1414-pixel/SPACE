# ==============================================================================
# SIH1518 — Render Blueprint Infrastructure as Code
# ==============================================================================
# This blueprint provisions:
# 1. FastAPI Backend + PyTorch ML Web Service (Docker runtime)
# 2. Managed PostgreSQL Database (with PostGIS extension)
# 3. Redis Instance (for async tasks and rate limiting)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend Web Service (FastAPI + PyTorch ML + GIS + 20 Tools + Reports)
  # ----------------------------------------------------------------------------
  - type: web
    name: sih1518-backend
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.backend
    dockerContext: .
    plan: standard
    region: singapore # Closest to India/ISRO latency
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_NAME
        value: "ISRO SIH1518 Change Intelligence Platform"
      - key: APP_VERSION
        value: "1.0.0"
      - key: ENVIRONMENT
        value: "production"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sih1518-postgis-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: sih1518-redis
          property: connectionString
      - key: STORAGE_TYPE
        value: "s3"
      - key: S3_ENDPOINT_URL
        sync: false # Set to Cloudflare R2 endpoint: https://<account_id>.r2.cloudflarestorage.com
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        value: "sih1518-storage"
      - key: S3_REGION_NAME
        value: "auto"
      - key: MODEL_DEVICE
        value: "cpu"
      - key: CORS_ORIGINS
        value: '["https://*.vercel.app", "http://localhost:5173", "http://localhost:3000"]'
      - key: LLM_PROVIDER
        value: "openai"
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # 2. Redis Service (Cache & Message Broker)
  # ----------------------------------------------------------------------------
  - type: redis
    name: sih1518-redis
    plan: starter
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # Only internal services

databases:
  # ----------------------------------------------------------------------------
  # 3. PostgreSQL Database (PostGIS Extension)
  # ----------------------------------------------------------------------------
  - name: sih1518-postgis-db
    databaseName: sih1518_gis
    user: sih1518_admin
    plan: starter
    region: singapore
    postgresMajorVersion: 15
